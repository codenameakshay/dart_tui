name: ci

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: stable
      - run: dart pub get
      - run: dart analyze
      # Formatting is platform-independent; skip on Windows so CRLF checkouts
      # don't trip --set-exit-if-changed with spurious line-ending diffs.
      - if: runner.os != 'Windows'
        run: dart format --output=none --set-exit-if-changed .
      # Windows: run the suite plainly (coverage tooling + bash are flaky there).
      - if: runner.os == 'Windows'
        run: dart test
      # Linux/macOS: run the suite with coverage and enforce the lib/ floor.
      - if: runner.os != 'Windows'
        run: bash tool/coverage.sh 90
      # The PTY smoke test relies on Python's Unix-only `pty` module.
      - if: runner.os != 'Windows'
        run: python3 tool/pty_examples_smoke.py
      - if: runner.os != 'Windows'
        run: python3 tool/pty_program_runtime_test.py
      - if: runner.os != 'Windows'
        run: python3 -m unittest -v tool/bench_command_test.py

  # pubspec.yaml declares sdk >=3.5.0; keep that floor tested.
  sdk-floor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: 3.5.4
      - run: dart pub get
      - run: dart analyze --fatal-infos
      - run: dart test

  # Parse every VHS tape so a broken tape fails CI. Never records GIFs.
  tapes:
    runs-on: ubuntu-latest
    env:
      VHS_VERSION: 0.12.1
      VHS_SHA256: eb33787a5b1cebf91fe0b18bd231e2d71d36c1ff4babd99ddac1a6ab411efd10
    steps:
      - uses: actions/checkout@v4
      - name: Install vhs
        run: |
          tarball="vhs_${VHS_VERSION}_Linux_x86_64.tar.gz"
          curl -fsSLO "https://github.com/charmbracelet/vhs/releases/download/v${VHS_VERSION}/${tarball}"
          echo "${VHS_SHA256}  ${tarball}" | sha256sum -c -
          tar -xzf "${tarball}"
          sudo install "vhs_${VHS_VERSION}_Linux_x86_64/vhs" /usr/local/bin/vhs
      - run: vhs validate example/tapes/*.tape

  website:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: website
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: website/package-lock.json
      - run: npm ci
      - run: npm audit --omit=dev
      - run: npm run lint
      - run: npm run build
