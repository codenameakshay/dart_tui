name: ci

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: stable
      - run: dart pub get
      - run: dart analyze
      # Formatting is platform-independent; skip on Windows so CRLF checkouts
      # don't trip --set-exit-if-changed with spurious line-ending diffs.
      - if: runner.os != 'Windows'
        run: dart format --output=none --set-exit-if-changed .
      - run: dart test
      # The PTY smoke test relies on Python's Unix-only `pty` module.
      - if: runner.os != 'Windows'
        run: python3 tool/pty_examples_smoke.py
