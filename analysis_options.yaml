include: package:lints/recommended.yaml

analyzer:
  # Verbatim website mirrors use URL slugs as filenames. Their canonical
  # example/*.dart sources remain inside the repository-wide analysis scope.
  exclude:
    - website/content/examples-src/**
    # Starter sources for `dart_tui create`, with `__name__` as the package.
    # test/create_starters_test.dart analyzes each generated starter.
    - templates/**
  language:
    strict-casts: true
    strict-inference: true
    strict-raw-types: true

linter:
  rules:
    - prefer_const_constructors
    - unawaited_futures
